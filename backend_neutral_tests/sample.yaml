        existing_tests: [addons/test_mail/tests/test_mail_followers.py, addons/test_mail/tests/test_mail_thread_internals.py]
        neutral_assertion: message_post on a record notifies exactly the followers subscribed to that subtype (compare notification partner set); search on message_is_follower / message_partner_ids matches a Python-side filter.
      - id: raw_sql.website
        addon: website
        model: website / website.visitor
        file: addons/website/models/website.py
        symbols: [_is_snippet_used, get_similarity_subquery]
        line: 2122
        also:
          - {file: addons/website/models/website_visitor.py, symbols: [_upsert_visitor, _get_additional_track_query_parts], line: 220}
        pattern: full-text / similarity search (pg_trgm style) over html fields; INSERT ... ON CONFLICT upsert for visitor tracking
        reason: Text-search SQL is the most backend-specific SQL in the repo; the neutral test asserts result sets, not ranking internals.
        existing_tests: [addons/website/tests/test_website_visitor.py, addons/website/tests/test_fuzzy.py]
        neutral_assertion: a page containing a snippet is reported as used after save and not after removal; visitor upsert is idempotent per token.
      - id: raw_sql.stock_quant
        addon: stock
        model: stock.quant
        file: addons/stock/models/stock_quant.py
        symbols: [_merge_quants, _unlink_zero_quants, _run_least_packages_removal_strategy_astar]
        line: 1210
        pattern: UPDATE/DELETE with GROUP BY to merge duplicate quants and drop zero quants
        reason: Inventory correctness depends on these clean-up queries; observable through quant counts and quantities.
        existing_tests: [addons/stock/tests/test_quant.py]
