        reason: test_fields (219 tests), test_search (67), test_domain_expression (86), test_read_group_private (29), test_properties (44) hold the bulk of ORM semantics; reusing by class keeps the neutral ones.
        existing_tests: [odoo/addons/test_base/tests/test_orm/test_fields.py, odoo/addons/test_base/tests/test_orm/test_search.py, odoo/addons/test_base/tests/test_orm/test_domain_expression.py]
        neutral_assertion: include classes TestParentStore, TestSelectionOndelete, TestUnlinkConstraints, TestRequiredMany2one, TestCompanyDependent, TestSearch, TestSearchAny, TestSearchRelated, TestExpression, TestMany2one/One2many/Many2many, TestPrivateReadGroup, PropertiesCase, TestORM, TestRecordset; exclude TestComputeQueries, TestModifiedPerformance, TestSubqueries, TestQueries, TestFlushSearch.

excluded:
  - item: odoo/addons/test_base/tests/test_orm/test_performance.py, test_timeit.py, test_query.py, test_registry.py, test_registry_signaling.py, test_schema.py, test_index_method.py, test_indexed_translation.py, test_read_grouping_sets.py, test_read_group_override.py, test_modules_db.py, test_uninstall.py, test_all_models.py, test_cache.py
    why: They measure PostgreSQL itself (query counts, SQL text, schema/DDL reflection, registry signalling via DB sequences, psycopg2 error classes). Not expressible as ORM-observable behaviour.
  - item: Schema management - odoo/tools/sql.py, odoo/modules/db.py, odoo/addons/base/models/ir_model.py (_reflect_constraint, query_insert/query_update), BaseModel._auto_init/_check_removed_columns
    why: DDL/reflection is a backend implementation concern, not ORM behaviour; a document store has no columns to reflect. Covered by backend-specific tests instead.
  - item: Country-specific EDI locking - addons/l10n_*_edi*/ (11 files with FOR UPDATE)
    why: Localisation addons; the same lock_for_update API is covered by the core/payment targets.
  - item: payment, resource, base_automation, account_edi, mrp, purchase locking call sites
    why: All call BaseModel.lock_for_update / try_lock_for_update (covered by concurrency.lock_for_update); listed as extension candidates, not primary targets, to keep the spread at eight addons.
  - item: mass_mailing (63 raw SQL sites), gamification (22), crm (19), analytic (17), pos_sale (27)
    why: Outside the agreed spread; their SQL shapes (bulk stats, leaderboards) repeat account/mail patterns. Extension candidates.
  - item: Downstream report views - website_crm_partner_assign, purchase_stock vendor_delay_report, hr_timesheet, hr_skills, fleet, lunch, event_sale, im_livechat reports
    why: Same two SQL-view styles as the selected reports; adding them adds fixtures, not new backend behaviour.
  - item: BaseModel._sql_error_to_message_generic and psycopg2.errors.* branches (odoo/orm/models.py)
    why: Translates PG error classes into messages; the neutral suite asserts on the raised exception class, not on message text.
  - item: HttpCase / JS tours, populate, cli, profiler
    why: Not ORM behaviour.
  - item: Query-count and SQL-text assertions anywhere (assertQueryCount, assertQueries, SQL(), cr.execute in tests)
    why: Ruled out by the board's definition of backend-neutral.

open_decisions:
  - id: D1
    question: Which exception class does the neutral suite assert for DB-enforced integrity violations?
    context: At flush time the ORM raises psycopg2.IntegrityError (see addons/hr_holidays/tests/test_holidays_flow.py::test_sql_constraint_dates); only the RPC layer (odoo/http/retrying.py, BaseModel._sql_error_to_message_generic) turns it into ValidationError.
    proposal: Define one backend-neutral alias (e.g. odoo.exceptions.IntegrityViolation or a tuple exported by the suite) that maps to psycopg2.IntegrityError on PG and to the future backend's class; tests import only the alias.
  - id: D2
    question: Same for lock / serialization failures.
    context: odoo/sql_db.py exports PG_CONCURRENCY_ERRORS_TO_RETRY (LockNotAvailable, SerializationFailure); callers catch psycopg2.OperationalError.
    proposal: Suite-level ConcurrencyError alias mapped the same way; multi-cursor tests use registry.cursor() only through a helper so the cursor type is swappable.
