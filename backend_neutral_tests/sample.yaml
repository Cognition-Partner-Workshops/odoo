# Machine-readable sample manifest (scan_counts: grep over odoo/ and addons/ *.py excluding tests/, static/, node_modules/) for the backend-neutral ORM test suite.
# Human-readable companion: SAMPLE.md. Validate with: python3 backend_neutral_tests/check_sample.py
# Every `file` is relative to the repo root; every `symbols` entry must appear in that file
# (checked as a whole-word regex); `line` is the line of the first symbol at `commit` (checked too).
version: 1
commit: 63446015e3c
repo: Cognition-Partner-Workshops/odoo
branch: "20.0"

addons:
  core: [odoo/orm, odoo/addons/base]
  spread: [account, stock, sale, mail, website, hr_holidays, point_of_sale, project]
  supporting: [product]   # pulled in by stock/sale/point_of_sale; used only for product.category hierarchy

selection_criteria:
  - id: C1
    rule: The target contains the category's pattern per the static scan (grep patterns listed in SAMPLE.md), not just a mention in a comment.
  - id: C2
    rule: The behaviour is reachable through a public ORM entry point (create/write/unlink/search/search_fetch/_read_group/flush) so an assertion can be written on records, values or a raised exception class only.
  - id: C3
    rule: Each category has targets in core plus at least two addons from the spread, so a backend bug is caught from more than one data shape.
  - id: C4
    rule: Prefer models whose fixtures are cheap (no chart of accounts, no POS session) unless the category is concentrated in that addon (account for raw SQL, point_of_sale for its own report).
  - id: C5
    rule: Prefer targets that an existing test already exercises, so the neutral test can reuse its data setup and the two can be diffed later.
  - id: C6
    rule: Prefer stable, named symbols (class attribute, method) over anonymous inline SQL so the manifest survives refactors; the checker verifies the symbol still exists.

categories:
  - id: integrity
    name: DB-enforced integrity (SQL constraints, unique indexes, FK ondelete)
    scan: "models.Constraint( | models.UniqueIndex( | ondelete="
    scan_counts: {constraint_files_non_test: 249, ondelete_files_non_test: 531, ondelete_restrict_sites: 170, ondelete_cascade_sites: 455, ondelete_set_null_sites: 93}
    targets:
      - id: integrity.res_users
        addon: base
        model: res.users / res.partner
        file: odoo/addons/base/models/res_users.py
        symbols: [_login_key, partner_id]
        line: 267
        also:
          - {file: odoo/addons/base/models/res_partner.py, symbols: [_check_name], line: 418}
        pattern: UNIQUE(login); CHECK on partner type/name; Many2one partner_id ondelete='restrict'
        reason: The simplest core unique constraint, a CHECK constraint, and a 'restrict' FK on the two models every other test touches.
        existing_tests: [addons/website/tests/test_website_reset_password.py]
        neutral_assertion: create two users with the same login -> integrity-violation exception; create contact without name -> integrity violation; unlink a partner that has a user -> integrity violation, partner still exists.
      - id: integrity.account_move
        addon: account
        model: account.move / account.move.line
        file: addons/account/models/account_move.py
        symbols: [_unique_name, _check_document_tax_mode_set]
        line: 825
        also:
          - {file: addons/account/models/account_move_line.py, symbols: [_check_credit_debit, _check_accountable_required_fields, move_id], line: 549}
        pattern: partial UniqueIndex "(name, journal_id) WHERE state='posted' AND name != '/'"; CHECK credit*debit=0; move_id ondelete='cascade'
        reason: Partial (conditional) unique index is the hardest integrity shape to emulate on a non-SQL backend; account is the largest constraint user outside core.
        existing_tests: [addons/account/tests/test_sequence_mixin.py::test_journal_sequence]
        neutral_assertion: two posted moves with same name+journal -> integrity violation, but two drafts named '/' are fine; a line with debit and credit both > 0 -> integrity violation; unlinking a move leaves zero lines for it.
      - id: integrity.hr_leave
        addon: hr_holidays
        model: hr.leave
        file: addons/hr_holidays/models/hr_leave.py
        symbols: [_date_check2, _date_check3, _duration_check, employee_id]
        line: 307
        pattern: three CHECK constraints on date order / non-negative duration; employee_id ondelete='restrict'
        reason: Plain CHECK constraints that an application layer could also enforce; the neutral test must fail identically whichever layer enforces them.
        existing_tests: [addons/hr_holidays/tests/test_holidays_flow.py::test_sql_constraint_dates]
        neutral_assertion: create/write with request_date_from > request_date_to -> integrity violation and no record persisted; unlink employee with leaves -> integrity violation.
      - id: integrity.mail_followers
        addon: mail
        model: mail.followers / discuss.channel.member
        file: addons/mail/models/mail_followers.py
        symbols: [_mail_followers_res_partner_res_model_id_uniq, partner_id]
        line: 39
        also:
          - {file: addons/mail/models/discuss/discuss_channel_member.py, symbols: [_partner_unique, _guest_unique, _partner_or_guest_exists], line: 251}
        pattern: composite unique (res_model,res_id,partner_id); partner_id ondelete='cascade'; partial UniqueIndex WHERE partner_id IS NOT NULL; XOR CHECK partner/guest
        reason: Composite uniqueness on a polymorphic (model,res_id) key plus cascade on partner delete is how every chatter-enabled model behaves; channel member adds the partial-unique + XOR shape.
        existing_tests: [addons/test_mail/tests/test_mail_followers.py::test_followers_multiple_subscription_force]
        neutral_assertion: subscribing the same partner twice to one record keeps exactly one follower (ORM path) and direct double create raises integrity violation; unlinking the partner removes its follower rows; a member with neither partner nor guest -> integrity violation.
      - id: integrity.stock_location
        addon: stock
        model: stock.location / stock.quant
        file: addons/stock/models/stock_location.py
        symbols: [_barcode_company_uniq, _inventory_freq_nonneg]
        line: 94
        also:
          - {file: addons/stock/models/stock_quant.py, symbols: [product_id, location_id], line: 47}
          - {file: addons/stock/models/stock_orderpoint.py, symbols: [_product_location_check], line: 127}
        pattern: unique(barcode,company_id) with NULL barcodes allowed; CHECK >= 0; quant product_id/location_id ondelete='restrict'; orderpoint unique(product_id,location_id,company_id)
        reason: Unique constraint where NULLs must not collide (SQL NULL semantics vs document-store null) and 'restrict' FKs protecting stock quantities.
        existing_tests: [addons/stock/tests/test_stock_location_search.py::test_10_location_search_by_barcode]
        neutral_assertion: two locations with same barcode in one company -> integrity violation; two locations with barcode False are fine; unlink a product that has quants -> integrity violation.
      - id: integrity.sale_order_line
        addon: sale
        model: sale.order / sale.order.line
        file: addons/sale/models/sale_order_line.py
        symbols: [_accountable_required_fields, _non_accountable_null_fields, order_id]
        line: 24
        also:
          - {file: addons/sale/models/sale_order.py, symbols: [_date_order_conditional_required, campaign_id], line: 51}
        pattern: CHECK constraints keyed on display_type; order_id ondelete='cascade'; campaign_id ondelete='set null'
        reason: Covers all three ondelete modes on one document (cascade lines, set-null UTM fields, restrict partner) plus state-dependent CHECK.
        existing_tests: [addons/sale/tests/test_sale_order.py]
        neutral_assertion: section line with a product -> integrity violation; unlink order -> its lines are gone; unlink utm.campaign -> order.campaign_id is False and order survives.

  - id: concurrency
    name: Concurrency and locking (FOR UPDATE / NOWAIT / SKIP LOCKED, serialization retry)
    scan: "FOR UPDATE | NOWAIT | SKIP LOCKED | FOR NO KEY UPDATE | lock_for_update | OperationalError | SerializationFailure"
    scan_counts: {lock_files_non_test: 44, retry_files_non_test: 19}
    targets:
      - id: concurrency.ir_sequence
        addon: base
        model: ir.sequence
        file: odoo/addons/base/models/ir_sequence.py
        symbols: [_update_nogap, _select_nextval, _predict_nextval]
        line: 57
        pattern: >-
          "SELECT ... FOR UPDATE NOWAIT" on no-gap sequences; PG sequences (nextval) for standard ones
        reason: The canonical "two transactions want the next number" problem; standard vs no_gap implementations have different backend expectations.
        existing_tests: [odoo/addons/base/tests/test_ir_sequence.py::TestIrSequenceNoGap]
        neutral_assertion: N concurrent cursors each drawing from one no_gap sequence produce N distinct, contiguous numbers once all commit; a second cursor drawing while the first holds the row raises a lock/concurrency exception class (not a hang).
      - id: concurrency.ir_cron
        addon: base
        model: ir.cron
        file: odoo/addons/base/models/ir_cron.py
        symbols: [_acquire_one_job, _get_all_ready_jobs, _process_job]
        line: 311
        pattern: >-
          "FOR NO KEY UPDATE SKIP LOCKED" job acquisition; TransactionRollbackError handling
        reason: Work-queue semantics (exactly one worker gets a job) are the behaviour a backend must preserve regardless of how locking is spelled.
        existing_tests: [odoo/addons/base/tests/test_ir_cron.py::test_cron_process_jobs_locked, odoo/addons/base/tests/test_ir_cron.py::test_acquire_processed_job]
        neutral_assertion: with the job row held by cursor A, _acquire_one_job on cursor B returns None; after A commits, B acquires it; a job is never run twice.
      - id: concurrency.lock_for_update
        addon: core
        model: BaseModel
        file: odoo/orm/models.py
        symbols: [lock_for_update, try_lock_for_update]
        line: 5056
        pattern: generic row locks (FOR [NO KEY] UPDATE SKIP LOCKED) used by payment, account_edi, base_automation, point_of_sale
        reason: The ORM-level locking API every addon is being migrated to; a backend only has to implement these two methods correctly.
        existing_tests: [odoo/addons/test_base/tests/test_orm/test_models.py, addons/payment/tests/test_payment_transaction.py]
        neutral_assertion: try_lock_for_update on cursor B returns the subset not locked by cursor A (empty when all are locked); lock_for_update on locked rows raises a concurrency exception class; records remain unchanged.
      - id: concurrency.discuss_channel
        addon: mail
        model: discuss.channel / mail.guest
        file: addons/mail/models/discuss/discuss_channel.py
        symbols: [_sync_last_interest_dt, _update_last_interest_dt]
        line: 770
        also:
          - {file: addons/mail/models/discuss/mail_guest.py, symbols: [_update_timezone], line: 129}
        pattern: try_lock_for_update(allow_referencing=True) + psycopg2.OperationalError swallowed; raw "FOR NO KEY UPDATE SKIP LOCKED"
        reason: >-
          "Best-effort update" pattern - a lost lock must degrade silently, not raise - which is the opposite expectation from ir_sequence.
        existing_tests: [addons/mail/tests/discuss/test_discuss_channel_last_interest.py]
        neutral_assertion: concurrent _sync_last_interest_dt on a channel locked elsewhere does not raise and leaves last_interest_dt either old or new (never corrupt); later call converges to the newest value.
      - id: concurrency.website_visitor
        addon: website
        model: website.visitor
        file: addons/website/models/website_visitor.py
        symbols: [_update_visitor_last_visit, _update_visitor_timezone, _upsert_visitor]
        line: 361
        pattern: >-
          "UPDATE ... WHERE id IN (SELECT ... FOR NO KEY UPDATE SKIP LOCKED)"; INSERT ... ON CONFLICT upsert
        reason: High-frequency, contention-tolerant update plus an upsert keyed on a unique access_token.
        existing_tests: [addons/website/tests/test_website_visitor.py::test_visitor_creation_on_tracked_page]
        neutral_assertion: two upserts with the same token yield one visitor; last_visit update under a concurrent lock is skipped without error and applied on the next call.
      - id: concurrency.stock_orderpoint_retry
        addon: stock
        model: stock.warehouse.orderpoint
        file: addons/stock/models/stock_orderpoint.py
        symbols: [_procure_orderpoint_confirm]
        line: 728
        also:
          - {file: addons/account/models/partner.py, symbols: [_increase_rank], line: 891}
        pattern: savepoint + except psycopg2.OperationalError -> retry/skip loop; separate registry cursor + OperationalError swallow
        reason: Application-level serialization retry; the neutral test only cares that the end state is correct after the retry, whichever error class triggered it.
        existing_tests: [addons/stock/tests/test_stock_order_point.py, addons/website_sale_loyalty/tests/test_concurrent_promo_code.py]
        neutral_assertion: running the procurement twice concurrently creates exactly one replenishment per orderpoint; partner rank increments by the number of successful calls and never raises to the caller.

