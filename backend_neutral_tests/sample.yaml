  - id: core_semantics
    name: Core ORM semantics already tested in odoo/addons/test_base/tests/test_orm
    scan: "assertQueryCount | assertQueries | cr.execute | SQL( | psycopg2 | registry | _as_query | flush_all/invalidate_all (allowed)"
    note: Classification by static scan of each file; counts are test methods. 'as-is' = zero backend-specific lines; 'edit' = neutral after removing or skipping the listed assertions; 'split' = reuse only the listed classes; 'exclude' = measures PostgreSQL itself.
    targets:
      - id: core.reuse_as_is
        addon: test_base
        model: various test_orm.* models
        file: odoo/addons/test_base/tests/test_orm/test_access.py
        symbols: [TestAccess]
        line: 11
        also:
          - {file: odoo/addons/test_base/tests/test_orm/test_acl.py, symbols: [test_field_visibility_restriction]}
          - {file: odoo/addons/test_base/tests/test_orm/test_copy.py, symbols: [TestCopyTranslations]}
          - {file: odoo/addons/test_base/tests/test_orm/test_create.py, symbols: [TestCreate]}
          - {file: odoo/addons/test_base/tests/test_orm/test_prefetch.py, symbols: [TestPrefecth]}
          - {file: odoo/addons/test_base/tests/test_orm/test_views.py, symbols: [TestDefaultView, TestViewGroups]}
          - {file: odoo/addons/test_base/tests/test_orm/test_check_access.py, symbols: [test_check_access]}
          - {file: odoo/addons/test_base/tests/test_orm/test_config_settings.py, symbols: [TestConfigSettings]}
          - {file: odoo/addons/test_base/tests/test_orm/test_json_field.py, symbols: [JsonFieldTest]}
          - {file: odoo/addons/test_base/tests/test_orm/test_ir_qweb_fields.py, symbols: [TestExport]}
          - {file: odoo/addons/test_base/tests/test_orm/test_action_bindings.py, symbols: [TestActionBindings]}
          - {file: odoo/addons/test_base/tests/test_orm/test_autovacuum.py, symbols: [TestAutovacuum]}
        pattern: no SQL text, no query counts, no cursor/savepoint use
        reason: 13 files / ~80 tests are already backend-neutral and can be collected unchanged.
        existing_tests: [odoo/addons/test_base/tests/test_orm/test_access.py, odoo/addons/test_base/tests/test_orm/test_acl.py, odoo/addons/test_base/tests/test_orm/test_copy.py, odoo/addons/test_base/tests/test_orm/test_create.py, odoo/addons/test_base/tests/test_orm/test_prefetch.py, odoo/addons/test_base/tests/test_orm/test_views.py]
        neutral_assertion: run as-is; they assert on record values, access errors (AccessError) and view structure only.
      - id: core.reuse_with_edits
        addon: test_base
        model: test_orm.* models
        file: odoo/addons/test_base/tests/test_orm/test_domain.py
        symbols: [TestDomain, TestDomainComplement, TestDomainOptimize]
        line: 15
        also:
          - {file: odoo/addons/test_base/tests/test_orm/test_parent_store.py, symbols: [TestParentStore]}
          - {file: odoo/addons/test_base/tests/test_orm/test_many2many.py, symbols: [test_not_in_relation_as_query]}
          - {file: odoo/addons/test_base/tests/test_orm/test_one2many.py, symbols: [assertQueryCount]}
          - {file: odoo/addons/test_base/tests/test_orm/test_inherits.py, symbols: [assertQueries]}
          - {file: odoo/addons/test_base/tests/test_orm/test_ir_rules.py, symbols: [assertQueryCount]}
          - {file: odoo/addons/test_base/tests/test_orm/test_company_checks.py, symbols: [assertQueryCount]}
          - {file: odoo/addons/test_base/tests/test_orm/test_search_order.py, symbols: [assertQueries]}
          - {file: odoo/addons/test_base/tests/test_orm/test_sort.py, symbols: [assertQueryCount]}
