        pattern: a handful of assertQueryCount/assertQueries/SQL() lines inside otherwise behavioural tests
        reason: ~160 tests whose only backend-specific lines are query-count guards or a raw SELECT used to double-check a value; the behavioural asserts next to them are the ones to keep.
        existing_tests: [odoo/addons/test_base/tests/test_orm/test_domain.py, odoo/addons/test_base/tests/test_orm/test_one2many.py, odoo/addons/test_base/tests/test_orm/test_inherits.py]
        neutral_assertion: copy the test with assertQueryCount/assertQueries replaced by a no-op context and raw SQL cross-checks replaced by .read(); keep every value/exception assertion.
      - id: core.reuse_split_by_class
