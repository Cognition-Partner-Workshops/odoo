        line: 1996
        also:
          - {file: odoo/orm/fields_relational.py, symbols: [read, write_batch, relation_delete], line: 1428}
        pattern: hand-built SELECT/UPDATE/INSERT; INSERT ... ON CONFLICT DO NOTHING for m2m relation tables
        reason: The ORM's own SQL is the minimum any backend must replace; m2m relation writes have set semantics (no duplicates, idempotent link/unlink).
        existing_tests: [odoo/addons/test_base/tests/test_orm/test_read_group_private.py, odoo/addons/test_base/tests/test_orm/test_many2many.py, odoo/addons/test_base/tests/test_orm/test_create.py]
        neutral_assertion: create/write/exists round-trips through the public API; linking the same m2m pair twice yields one link; unlink of a non-linked pair is a no-op.
